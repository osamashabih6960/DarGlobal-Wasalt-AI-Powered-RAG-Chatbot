<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dar Global Ã— Wasalt | Property Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600&display=swap">
<style>
:root{--bg:#08121C;--panel:#0F1B29;--bubble:#162A3C;--gold:#D9BE85;--em:#36D1A0;--em-d:#0E6B55;--muted:#9FB0C0;--text:#EAF0F5;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow-x:hidden;position:relative}
button{font-family:inherit;cursor:pointer}
.wm{position:fixed;left:-1vw;font-weight:800;line-height:1;letter-spacing:-.03em;white-space:nowrap;color:transparent;pointer-events:none;user-select:none;font-size:14.2vw;z-index:0}
.wm.a{top:5vh;-webkit-text-stroke:1.5px rgba(217,190,133,.2)}
.wm.b{top:26vh;-webkit-text-stroke:1.5px rgba(54,209,160,.2)}
.wm.c{top:58vh;-webkit-text-stroke:1.5px rgba(255,255,255,.07)}
.brand-logo{font-size:23px;font-weight:800;letter-spacing:2px;color:#fff;white-space:nowrap}.brand-logo span{font-weight:400;margin-left:3px;letter-spacing:1px}
header{position:relative;z-index:2;height:88px;padding:0 clamp(16px,5vw,72px);display:flex;align-items:center;gap:20px}
header img{height:48px;width:auto}
.x{font-size:24px;color:#8497A8}
.wasalt{font-size:28px;font-weight:700;letter-spacing:-.5px;color:#fff;display:flex;align-items:center;gap:8px}
.wasalt i{width:10px;height:10px;border-radius:2px;background:var(--em);display:inline-block}
.sp{flex:1}
.agent{height:44px;padding:0 22px;border-radius:22px;background:transparent;border:1px solid var(--gold);color:var(--gold);font-size:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center}
main{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,620px) 1fr;gap:48px;padding:0 clamp(16px,5vw,72px) 32px;align-items:start}
.panel{height:calc(100vh - 120px);min-height:560px;background:var(--panel);border:1px solid var(--line);border-radius:26px;display:flex;flex-direction:column;overflow:hidden}
.ph{padding:18px 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.av{width:44px;height:44px;border-radius:50%;background:#12806A;display:grid;place-items:center}
.ph .t{flex:1}
.ph b{display:block;font-size:17px;font-weight:600;color:#fff}
.ph small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;display:inline-block}
.icon-btn{width:44px;height:44px;border-radius:50%;background:transparent;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center}
#log{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{max-width:85%;padding:12px 16px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{align-self:flex-start;background:var(--bubble);border:1px solid rgba(255,255,255,.08);border-radius:20px 20px 20px 4px}
.msg.user{align-self:flex-end;background:var(--em-d);color:#fff;border-radius:20px 20px 4px 20px}
.msg.err{border-color:#E5484D}
.typing{align-self:flex-start;background:var(--bubble);border:1px solid rgba(255,255,255,.08);border-radius:20px 20px 20px 4px;padding:15px 16px;display:flex;gap:5px}
.typing span{width:7px;height:7px;border-radius:50%;background:#8A94A0;animation:b 1.1s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.chips{display:flex;align-items:center;column-gap:12px;row-gap:12px;flex-wrap:wrap;margin-top:14px}
.chip{min-height:44px;padding:0 16px;background:transparent;border:1px solid rgba(217,190,133,.55);border-radius:22px;font-size:13px;font-weight:500;color:var(--gold)}
.chip:hover{background:rgba(217,190,133,.1)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:#12202F;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.card .img{position:relative;height:96px;background:#0D1926;display:grid;place-items:center}
.card .tag{position:absolute;left:12px;top:12px;color:#08121C;font-size:11px;font-weight:700;letter-spacing:1px;padding:5px 10px;border-radius:12px;background:var(--gold)}
.card.w .tag,.card.w .btn{background:var(--em)}
.card .body{padding:14px;display:flex;flex-direction:column;gap:5px}
.card .loc{font-size:12px;color:var(--muted)}
.card .name{font-family:'Playfair Display',serif;font-weight:600;font-size:19px;color:#fff}
.card .spec{font-size:13px;color:var(--muted)}
.card .price{font-size:17px;font-weight:600;color:var(--gold)}
.card.w .price{color:var(--em)}
.card .btn{margin-top:6px;height:44px;border-radius:12px;background:var(--gold);color:#08121C;border:0;font-size:14px;font-weight:600;display:grid;place-items:center;text-decoration:none}
.src{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px}
.src a{color:var(--gold)}
form{padding:16px 24px 24px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:12px}
input{flex:1;min-width:0;height:52px;border-radius:26px;border:1px solid rgba(255,255,255,.16);background:#0A1520;color:#fff;padding:0 22px;font:inherit;font-size:15px}
input::placeholder{color:#8497A8}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--em);outline-offset:2px}
.send{width:52px;height:52px;border-radius:50%;background:var(--gold);border:0;display:grid;place-items:center}
.send:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:11.5px;color:var(--muted);padding:0 24px 14px;margin-top:-10px}
.city{width:100%;max-width:600px;height:auto;justify-self:center;margin-top:8px}
@media(max-width:980px){main{grid-template-columns:1fr}.city{display:none}.wm{display:none}.panel{height:calc(100vh - 100px)}.agent{display:none}}
@media(prefers-reduced-motion:reduce){.typing span{animation:none}#log{scroll-behavior:auto}}
</style>
</head>

</main>
<script>
const API_URL = "/api/chat";          // change if your backend uses a different route
const log = document.getElementById("log"), form = document.getElementById("form"),
      input = document.getElementById("msg"), sendBtn = document.getElementById("send");
const QUICK = ["Browse apartments","Search by budget","View all projects","Payment plans","Search by location","Talk to an agent"];
let history = [], busy = false;

const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const safeUrl = u => { try { const x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
const scroll = () => { log.scrollTop = log.scrollHeight; };

function addMsg(role, text, extra) { const m = el("div", "msg " + role + (extra ? " " + extra : ""), text); log.appendChild(m); scroll(); return m; }

function addChips(items) {
  const w = el("div", "chips");
  items.forEach(t => { const b = el("button", "chip", t); b.type = "button"; b.onclick = () => { w.remove(); send(t); }; w.appendChild(b); });
  log.appendChild(w); scroll();
}

function addCards(cards) {
  const wrap = el("div", "cards");
  cards.forEach(c => {
    const isW = /wasalt/i.test(c.company || "");
    const card = el("div", "card" + (isW ? " w" : ""));
    const img = el("div", "img");
    img.appendChild(el("span", "tag", (c.company || "").toUpperCase()));
    const f = isW ? ["#36D1A0","#0A5644","#12806A"] : ["#F2DCA4","#7A5F26","#BF9B50"];
    img.insertAdjacentHTML("beforeend", `<svg width="56" height="56" viewBox="0 0 60 60" aria-hidden="true"><polygon points="30,10 52,22 30,34 8,22" fill="${f[0]}"/><polygon points="8,22 30,34 30,56 8,44" fill="${f[1]}"/><polygon points="30,34 52,22 52,44 30,56" fill="${f[2]}"/></svg>`);
    const body = el("div", "body");
    if (c.location) body.appendChild(el("div", "loc", c.location));
    body.appendChild(el("div", "name", c.title || "Property"));
    if (c.specs) body.appendChild(el("div", "spec", c.specs));
    if (c.price) body.appendChild(el("div", "price", c.price));
    const u = safeUrl(c.url);
    if (u) { const a = el("a", "btn", "View details"); a.href = u; a.target = "_blank"; a.rel = "noopener"; body.appendChild(a); }
    card.append(img, body); wrap.appendChild(card);
  });
  log.appendChild(wrap); scroll();
}

function addSources(list) {
  const items = (list || []).map(s => ({ title: s.title || s.source_url || s.url, url: safeUrl(s.url || s.source_url) })).filter(s => s.url);
  if (!items.length) return;
  const w = el("div", "src"); w.appendChild(el("span", null, "Sources:"));
  items.slice(0, 4).forEach(s => { const a = el("a", null, s.title.length > 40 ? s.title.slice(0, 40) + "â€¦" : s.title); a.href = s.url; a.target = "_blank"; a.rel = "noopener"; w.appendChild(a); });
  log.appendChild(w); scroll();
}

function setBusy(v) { busy = v; sendBtn.disabled = v; input.disabled = v; if (!v) input.focus(); }

async function send(text) {
  text = (text || "").trim();
  if (!text || busy) return;
  addMsg("user", text); input.value = ""; setBusy(true);
  const typing = el("div", "typing"); typing.setAttribute("aria-label", "Assistant is typing");
  typing.innerHTML = "<span></span><span></span><span></span>"; log.appendChild(typing); scroll();
  try {
    const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, history: history.slice(-10) }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    typing.remove();
    const answer = d.answer || d.response || d.reply || "Sorry, I could not find that in the available data.";
    addMsg("bot", answer);
    if (Array.isArray(d.cards) && d.cards.length) addCards(d.cards);
    addSources(d.sources);
    history.push({ role: "user", content: text }, { role: "assistant", content: answer });
    addChips(["Compare these", "Payment plans", "Book a site visit"]);
  } catch (e) {
    typing.remove();
    addMsg("bot", "Something went wrong while contacting the server. Please try again in a moment.", "err");
    console.error(e);
  } finally { setBusy(false); }
}

function start() {
  log.innerHTML = ""; history = [];
  addMsg("bot", "Hi! I can help you explore Dar Global and Wasalt properties. Ask me about projects, prices, payment plans or locations.");
  addChips(QUICK);
}
form.addEventListener("submit", e => { e.preventDefault(); send(input.value); });
document.getElementById("reset").onclick = start;
document.getElementById("agent").onclick = e => { e.preventDefault(); send("I would like to talk to an agent"); };
start();
</script>
