<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DarGlobal x Wasalt Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#0c2a2c;--deep2:#12393c;--sand:#e9dfcc;--brass:#c9a35b;--ink:#10201f;--paper:#fbf9f4;--line:#d9d2c2}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.55 Manrope,system-ui,sans-serif;color:var(--ink);background:var(--paper);display:grid;grid-template-columns:320px 1fr}
aside{background:var(--deep);color:var(--sand);padding:36px 28px;display:flex;flex-direction:column;gap:28px;overflow:auto}
.brand{font:700 30px/1.1 Fraunces,Georgia,serif;letter-spacing:.2px}
.brand small{display:block;font:500 14px Manrope,sans-serif;color:var(--brass);margin-top:8px;letter-spacing:0}
aside p{margin:0;color:#b9c4bd;font-size:14px}
.suggest{display:flex;flex-direction:column;gap:10px}
.suggest button{all:unset;cursor:pointer;padding:12px 14px;border:1px solid #2c5558;border-radius:10px;font-size:14px;color:var(--sand);background:var(--deep2)}
.suggest button:hover{border-color:var(--brass)}
.foot{margin-top:auto;font-size:12px;color:#8ba19c}
main{display:flex;flex-direction:column;height:100vh;min-width:0}
#log{flex:1;overflow:auto;padding:36px max(24px,8vw) 12px;display:flex;flex-direction:column;gap:18px}
.hello{max-width:560px;margin:8vh 0 0}
.hello h1{font:700 40px/1.1 Fraunces,Georgia,serif;margin:0 0 12px;color:var(--deep)}
.hello p{color:#4b5a58;margin:0}
.msg{max-width:720px;padding:14px 18px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--deep);color:var(--sand);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.src{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.src a{font-size:12px;color:var(--deep);text-decoration:none;border:1px solid var(--brass);border-radius:999px;padding:3px 10px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src a:hover{background:var(--brass);color:#fff}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--brass);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.5}}
form{display:flex;gap:10px;padding:14px max(24px,8vw) 26px}
input{flex:1;font:inherit;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
form button{font:700 15px Manrope,sans-serif;border:0;border-radius:12px;padding:0 24px;background:var(--brass);color:var(--deep);cursor:pointer}
form button:disabled{opacity:.5;cursor:wait}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{padding:18px;gap:12px}.suggest,.foot,aside p{display:none}main{height:auto;min-height:0}}
@media(prefers-reduced-motion:reduce){.dots span{animation:none}}
</style>
</head>
<body>
<aside>
  <div class="brand">DarGlobal<br>x Wasalt<small>Property intelligence assistant</small></div>
  <p>Answers come only from public pages of both companies, with the source of every answer shown.</p>
  <div class="suggest" id="sg">
    <button>What does DarGlobal do?</button>
    <button>What is Wasalt?</button>
    <button>Which projects does DarGlobal have?</button>
    <button>How can I contact Wasalt?</button>
  </div>
  <div class="foot">LangGraph + LangChain + FAISS. Traced with LangSmith.</div>
</aside>
<main>
  <div id="log" aria-live="polite">
    <div class="hello" id="hello"><h1>Ask about projects, services and people.</h1><p>Try a question on the left, or type your own.</p></div>
  </div>
  <form id="f"><input id="q" placeholder="Ask about DarGlobal or Wasalt" autocomplete="off" maxlength="1000" aria-label="Your question"><button id="go">Send</button></form>
</main>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),go=document.getElementById('go');
const sid=(crypto.randomUUID?crypto.randomUUID():String(Math.random())).slice(0,36);
function add(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function type(el,text){for(let i=0;i<=text.length;i+=4){el.textContent=text.slice(0,i);log.scrollTop=log.scrollHeight;await new Promise(r=>setTimeout(r,12))}}
async function send(text){
  document.getElementById('hello')?.remove();
  add('me',text);go.disabled=true;
  const b=add('bot','');b.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session_id:sid})});
    if(!r.ok)throw new Error((await r.json()).detail||r.statusText);
    const j=await r.json();b.textContent='';await type(b,j.answer);
    if(j.sources&&j.sources.length){const s=document.createElement('div');s.className='src';
      j.sources.forEach(x=>{const a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent=x.title||x.url;s.appendChild(a)});b.appendChild(s)}
  }catch(e){b.textContent='Sorry, something went wrong: '+e.message}
  go.disabled=false;q.focus();
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const t=q.value.trim();if(t){q.value='';send(t)}};
document.getElementById('sg').onclick=e=>{if(e.target.tagName==='BUTTON')send(e.target.textContent)};
</script>
</body>
</html>
