services:
  app:
    build: .
    ports: ["7861:7860"]
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on: [mlflow]
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
    volumes: ["mlflow_data:/mlflow"]
volumes:
  mlflow_data:
